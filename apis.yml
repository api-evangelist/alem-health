aid: alem-health
name: Alem Health
description: >-
  AlemHealth is an AI-powered teleradiology and medical imaging platform that
  unifies image acquisition, diagnostic reading, reporting, and analytics into a
  single cloud system used by 500+ radiologists across 20+ countries. Its product
  suite includes Connect PACS (cloud image archiving with an FDA-approved
  diagnostic viewer), FrontDesk RIS scheduling, a referring-physician Referral
  Portal, a patient QR-access app, and the AlemBox gateway and AlemHub
  reporting-server hardware. AI features cover automated report drafting,
  quality-assurance scoring, laterality-mismatch detection, and ICD-10 tagging,
  metered via an AI-tokens model. For providers, AlemHealth supports
  bi-directional HL7, FHIR, and API integrations plus standard DICOM
  connectivity to sync orders, patient demographics, and finalized reports with
  existing EMR/EHR and PACS systems.
